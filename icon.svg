<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13203c"/>
      <stop offset="1" stop-color="#080d1a"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.30" r="0.75">
      <stop offset="0" stop-color="#2b4170" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2b4170" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.55" stop-color="#84cc16"/>
      <stop offset="1" stop-color="#d9f99d"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cdd8f0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- full-bleed background (safe for maskable icons) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#spot)"/>

  <!-- protein ring: track + ~80% lime arc -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#1c2b4d" stroke-width="36"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="36"
          stroke-linecap="round" stroke-dasharray="754 942" transform="rotate(-90 256 256)"
          filter="url(#glow)"/>

  <!-- dumbbell inside the ring, tilted for energy -->
  <g transform="rotate(-18 256 256)" fill="url(#bar)" filter="url(#soft)">
    <rect x="198" y="243" width="116" height="26" rx="13"/>
    <rect x="176" y="222" width="26" height="68" rx="11"/>
    <rect x="310" y="222" width="26" height="68" rx="11"/>
    <rect x="156" y="233" width="20" height="46" rx="9"/>
    <rect x="336" y="233" width="20" height="46" rx="9"/>
  </g>
</svg>
