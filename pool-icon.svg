<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="felt" cx="0.5" cy="0.30" r="0.95">
      <stop offset="0" stop-color="#1a6e4e"/>
      <stop offset="0.55" stop-color="#0d4631"/>
      <stop offset="1" stop-color="#05140e"/>
    </radialGradient>
    <radialGradient id="ball" cx="0.37" cy="0.30" r="0.95">
      <stop offset="0" stop-color="#6d6d6d"/>
      <stop offset="0.35" stop-color="#2a2a2a"/>
      <stop offset="0.70" stop-color="#101010"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="gloss" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8ff00"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed felt (maskable-safe) -->
  <rect width="512" height="512" fill="url(#felt)"/>

  <!-- brand ring -->
  <circle cx="256" cy="252" r="186" fill="none" stroke="url(#rim)" stroke-width="5" opacity="0.45"/>

  <!-- ground shadow -->
  <ellipse cx="256" cy="436" rx="118" ry="24" fill="#000000" opacity="0.35"/>

  <!-- 8-ball -->
  <circle cx="256" cy="252" r="165" fill="url(#ball)"/>
  <!-- gloss highlight -->
  <ellipse cx="205" cy="188" rx="72" ry="54" fill="url(#gloss)" opacity="0.85"/>
  <!-- number disc -->
  <circle cx="256" cy="252" r="62" fill="#f7f7f2"/>
  <text x="256" y="279" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#111111">8</text>
</svg>
